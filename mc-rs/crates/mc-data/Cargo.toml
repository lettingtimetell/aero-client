[package]
name        = "mc-data"
description = "Static game tables: blocks, items, entities, biomes, potions."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mc-core.workspace   = true
thiserror.workspace = true

# The runtime tables are `static` Rust data, so nothing is parsed at run time.
# serde_json is only used by tests/golden_extractor.rs, which re-reads the extractor's
# JSON and checks the generated tables against it.
[dev-dependencies]
serde_json.workspace = true
