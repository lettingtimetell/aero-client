[package]
name        = "mc-update"
description = "The portable client's updater: GitHub release check, verified download, staging, and an app folder swap on restart with rollback."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Every dependency below is already in Cargo.lock through the client (reqwest's rustls brings ring;
# rustc_version brings semver), so this crate adds no new crate to the build graph.
[dependencies]
thiserror.workspace  = true
tracing.workspace    = true
serde.workspace      = true
serde_json.workspace = true
base64.workspace     = true
reqwest.workspace    = true
# A private current-thread runtime on the updater's own thread (reqwest is async).
tokio                = { workspace = true, features = ["rt", "net", "time"] }
# Reading the release zip (deflate only), entry by entry: see `stage.rs` for why the crate's own
# extract helpers are not used.
zip.workspace        = true
# SHA-256 and Ed25519 verification: the same `ring` rustls already links.
ring                 = "0.17"
# Release tags compared by semver precedence.
semver               = "1"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
tokio              = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
