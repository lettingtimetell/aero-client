# Continuous integration for Aero Client (mc-rs).
#
# Runs only when started by hand: Actions, then "ci", then "Run workflow". Part of the test suite
# needs your own Minecraft 1.8.9 files (CONTRIBUTING.md, sections 4 and 7), which must never be
# committed, so the jobs below run the checks and the tests that pass without them. This workflow
# has not been run on GitHub's runners yet: add `push` and `pull_request` triggers once a run is
# green and the known clippy findings are fixed.
name: ci

on:
  workflow_dispatch:

# The jobs only read the repository (check out, build, test, upload an artifact), so the token
# they get can read and nothing more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MC_NO_AUDIO: "1"

jobs:
  lint:
    name: format and clippy
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mc-rs
    steps:
      - uses: actions/checkout@v4

      # The toolchain mc-rs/rust-toolchain.toml selects: stable, minimal profile, rustfmt, clippy.
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mc-rs/target
          key: lint-${{ runner.os }}-${{ hashFiles('mc-rs/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      # Fails on four known findings in test and experiment code until they are fixed
      # (CONTRIBUTING.md, section 7). --keep-going reports every crate, not just the first.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  test:
    name: tests that need no Minecraft files
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mc-rs
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mc-rs/target
          key: test-${{ runner.os }}-${{ hashFiles('mc-rs/Cargo.lock') }}

      # The crates whose tests pass without Minecraft files (checked on a Windows PC with a GPU).
      # Tests that render skip themselves on a runner without a GPU adapter (they print `skip:`).
      # mc-assets and mc-client need the files; mc-nbt and mc-parity run in the next steps.
      - name: Rust tests
        run: >-
          cargo test --locked
          -p mc-core -p mc-math -p mc-data -p mc-protocol -p mc-auth -p mc-physics -p mc-world
          -p mc-replay -p mc-mods -p mc-media -p mc-video -p mc-audio -p mc-ui -p mc-render
          -p mc-update

      # The three golden-file tests compare the two reference NBT files that
      # setup-vanilla-files.ps1 writes; everything else in mc-nbt needs no files.
      - name: NBT tests
        run: >-
          cargo test --locked -p mc-nbt --
          --skip every_dat_in_jars_round_trips_byte_identically
          --skip level_dat_parses_and_is_gzipped
          --skip servers_dat_parses_to_the_expected_server_list

      # `--nocapture` puts the suite's own evidence in the log: the hazard-coverage map, the
      # per-scenario "bit-exact" lines and the replay summary.
      - name: Parity suite
        run: cargo test --locked -p mc-parity -- --nocapture

      # A wider pass of the round-trip fuzzing: proptest's shrinking driver and the seeded loop,
      # whose failures reproduce from the seed printed in the log.
      - name: Extended round-trip fuzzing
        env:
          PROPTEST_CASES: "4096"
          MC_PARITY_FUZZ_ITERS: "20000"
        run: cargo test --locked -p mc-parity --test fuzz -- --nocapture

      - name: Benchmark tool tests
        working-directory: mc-rs/optimization
        run: python -m unittest test_quick_ab_window test_benchmark_lease test_frame_metrics

      # The no-Minecraft-files guard's own tests, including a payload it must reject.
      - name: Payload guard self-test
        shell: pwsh
        run: pwsh -File packaging/scripts/verify-payload.tests.ps1

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -File packaging/windows/build.ps1
            artefact: mc-rs-*-windows-*
          - os: ubuntu-latest
            script: sh packaging/linux/build.sh
            artefact: mc-rs-*-linux-*
          - os: macos-latest
            script: sh packaging/macos/build.sh
            artefact: mc-rs-*-macos-*
    runs-on: ${{ matrix.os }}
    # Only Windows has ever been built and played. The Linux and macOS scripts have never been
    # run anywhere, so their legs report without failing the workflow.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mc-rs
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # winit and wgpu need the X11, Wayland and xkbcommon headers on Linux; the audio output
      # needs ALSA's.
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev

      # The script builds the `dist` profile without default features (no development login),
      # stages the client with a launcher that finds the player's own Minecraft folder, and fails
      # if anything that looks like a Minecraft file is in the package.
      - name: Build the package
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-package
          path: mc-rs/target/package/${{ matrix.artefact }}
          if-no-files-found: error
